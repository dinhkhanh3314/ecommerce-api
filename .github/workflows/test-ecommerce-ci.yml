name: E-commerce API CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce123
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecommerce -d ecommerce"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prisma
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma migration
        env:
          DATABASE_URL: postgresql://ecommerce:ecommerce123@localhost:5432/ecommerce?schema=public
        run: npx prisma migrate deploy

      - name: Start API
        env:
          PORT: 3000
          DATABASE_URL: postgresql://ecommerce:ecommerce123@localhost:5432/ecommerce?schema=public
          JWT_SECRET: ecommerce_secret_key_123456
        run: |
          node app.js > api.log 2>&1 &
          sleep 3
          cat api.log

      - name: Health Check
        run: |
          sleep 5
          curl --fail http://localhost:3000/api/health
